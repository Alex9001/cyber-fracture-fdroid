name: Deploy F-Droid repository

on:
  push:
    branches: [main]
    paths:
      - 'fdroid/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d1d8e3c1d44c47c4bb6871f9aa5aa4edc95c7dd # v4.1.7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fdroid
      - id: deployment
        uses: actions/deploy-pages@v4
